<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PlayTech Store - PS4 Jailbreak</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
        radial-gradient(circle at 50% -10%, #173b68 0%, transparent 42%),
        linear-gradient(180deg, #070b11 0%, #05070a 100%);
    color: #dce6f2;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
}

body {
    min-height: 100vh;
}

#page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

#header {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;

    background: rgba(7, 12, 19, 0.92);
    border-bottom: 1px solid rgba(76, 151, 255, 0.20);

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35),
        inset 0 -1px rgba(255, 255, 255, 0.02);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(135deg, #1683ff, #0053b8);

    box-shadow:
        0 0 20px rgba(22, 131, 255, 0.28),
        inset 0 1px rgba(255,255,255,0.22);

    font-size: 21px;
    font-weight: 900;
    color: white;
}

.brand-name {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

.brand-name strong {
    font-size: 17px;
    letter-spacing: 2px;
    color: #ffffff;
}

.brand-name span {
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 1.8px;
    color: #6f9cca;
    text-transform: uppercase;
}

.version {
    font-size: 11px;
    color: #68798d;
    letter-spacing: 1px;
}

/* =========================
   MAIN
========================= */

#main {
    width: 100%;
    max-width: 760px;
    margin: auto;
    padding: 45px 20px 30px;
}

/* =========================
   STATUS CARD
========================= */

.status-card {
    position: relative;
    overflow: hidden;

    padding: 28px;

    border: 1px solid rgba(91, 132, 177, 0.18);
    border-radius: 18px;

    background:
        linear-gradient(
            145deg,
            rgba(17, 27, 40, 0.96),
            rgba(8, 13, 20, 0.96)
        );

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.40),
        inset 0 1px rgba(255,255,255,0.025);
}

.status-card::before {
    content: "";
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #278fff,
            transparent
        );

    opacity: .8;
}

.status-label {
    margin-bottom: 9px;

    color: #61748a;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
}

#state {
    margin: 0 0 14px;

    font-size: 25px;
    line-height: 1.25;
    font-weight: 800;

    color: #ffffff;
}

#out {
    display: none;
}

/* =========================
   RUNNING SPINNER + MESSAGE
========================= */

#spin {
    position: fixed;
    top: calc(50% + 20px);
    left: 50%;
    width: 52px;
    height: 52px;
    margin: -26px 0 0 -26px;

    border: 4px solid #17202c;
    border-top-color: #278fff;
    border-radius: 50%;

    animation: spin 0.9s linear infinite;

    box-shadow:
        0 0 24px rgba(39, 143, 255, 0.25);
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

#msg {
    position: fixed;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
    text-align: center;
    font-size: 16px;
    letter-spacing: 0.5px;
    display: none;

    color: #dce6f2;
}

body.done #spin {
    display: none;
}

body.fail #spin {
    display: none;
}

body.fail #msg {
    display: block;
}

/* =========================
   LOG VIEW (?log=1)
========================= */

body.log #spin,
body.log #msg {
    display: none;
}

body.log #out {
    display: block;
    white-space: pre-wrap;
    font:
        12px/1.45 Consolas,
        monospace;
    background: #0a1119;
    border: 1px solid rgba(91, 132, 177, 0.18);
    border-radius: 10px;
    padding: 12px 14px;
    max-height: 55vh;
    overflow-y: auto;
    color: #9fb3d0;
}

/* =========================
   STATUS COLORS
========================= */

.ok {
    color: #63d39b !important;
}

.bad {
    color: #ff7474 !important;
}

.warn {
    color: #ffc85a !important;
}

.safe {
    color: #63d39b !important;
}

.danger {
    color: #ff7474 !important;
}

code {
    color: #9fb3d0;
}

/* =========================
   FOOTER
========================= */

#footer {
    margin-top: auto;
    padding: 24px 20px;

    text-align: center;

    border-top: 1px solid rgba(91, 132, 177, 0.10);

    color: #526276;
    font-size: 10px;
    letter-spacing: .7px;
}

#footer strong {
    color: #71869f;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #header {
        padding: 0 17px;
    }

    .version {
        display: none;
    }

    #main {
        padding: 32px 15px 25px;
    }

    .status-card {
        padding: 23px 20px;
    }

    #state {
        font-size: 21px;
    }
}
</style>

</head>

<body>

<div id="page">

<!-- HEADER -->
<header id="header">

    <div class="brand">

        <div class="logo">P</div>

        <div class="brand-name">
            <strong>PLAYTECH STORE</strong>
            <span>Gaming &amp; Technology</span>
        </div>

    </div>

    <div class="version">
        PS4 WEB HOST
    </div>

</header>


<!-- MAIN -->
<main id="main">

    <section class="status-card">

        <div class="status-label">
            Jailbreak Status
        </div>

        <div id="state"></div>

        <div id="out"></div>

    </section>

</main>


<!-- FOOTER -->
<footer id="footer">
    <strong>PLAYTECH STORE</strong>
    &nbsp;•&nbsp;
    PS4 Web Host
</footer>

</div>

<div id="spin"></div>
<div id="msg">Restart your console</div>

<script type="module">
  import "./jb.js?v=10";
</script>

</body>
</html>
